name: secrets-workflow

on:
  push:

jobs:
  use-secret:
    runs-on: ubuntu-latest
    steps:
    - name: Access the secret
      run: echo "The secret is \${{ secrets.SECRET }}"
    
    - name: Authenticating to an API
      env:
        API_KEY: ${{ secrets.SECRET }}
      run: echo "API key is ${API_KEY}"
